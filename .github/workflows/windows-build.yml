name: Windows-Programm bauen

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -r requirements.txt pytest rasterio
      - run: python -m pytest -q

  windows-exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller pillow
      - run: python tools/make_icon.py
      - name: .exe bauen
        shell: pwsh
        run: |
          $icon = @()
          if (Test-Path luftbild_editor/resources/logo.ico) { $icon = @("--icon", "luftbild_editor/resources/logo.ico") }
          pyinstaller --noconfirm --windowed --name "Luftbild-Editor PZU" --collect-submodules imagecodecs `
            --add-data "luftbild_editor/resources:luftbild_editor/resources" @icon run_editor.py
      - name: Selbsttest der .exe mit großem Scan (10701 x 10137 px)
        shell: pwsh
        run: |
          python -c "from tests.sample import write_big_sample; write_big_sample('probe.tif')"
          $p = Start-Process -FilePath "dist\Luftbild-Editor PZU\Luftbild-Editor PZU.exe" `
               -ArgumentList '--selbsttest', "$PWD\probe.tif", "$PWD\bericht.txt" -Wait -PassThru
          if (Test-Path bericht.txt) { Get-Content bericht.txt } else { Write-Host "Kein Bericht erzeugt" }
          $log = Join-Path $env:APPDATA "Luftbild-Editor\protokoll.txt"
          if (Test-Path $log) { Write-Host "--- Protokoll ---"; Get-Content $log }
          exit $p.ExitCode
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Selbsttest-Bildschirmfotos
          path: selbsttest_*.png
      - uses: actions/upload-artifact@v4
        with:
          name: Luftbild-Editor-PZU-Windows
          path: dist/Luftbild-Editor PZU
