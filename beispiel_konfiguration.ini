# Konfiguration für dgm1945_kern.py – Alternative zum Assistenten
# Relative Pfade beziehen sich auf den Ordner dieser Datei.
# Aufruf:  python dgm1945_kern.py beispiel_konfiguration.ini   (oder Datei auf DGM1945_starten.bat ziehen)

[daten]
punkte         = 2026_08_11_HP_geeignet_fg_Pan.shp     # Höhenpunkte 1945
# punkte_hoehe_feld = HOEHE_FG                          # leer = automatisch
gelaendelinien = 2026_09_11_Pan_Gelaendelinien.shp     # Linien für die Interpolation
# linien_hoehe_feld = Hoe_Inf                           # Werte mit "DGM"/"Sohle" -> Höhe aus DGM1
dgm1           = DGM1_Kacheln                          # Mosaik-Datei, Ordner oder Kacheln getrennt durch ;
untersuchungsgebiet = Untersuchungsgebiet.shp          # empfohlen

[sohle]
# sohle        = Emschersohle.shp                      # Sohllinien mit Z-Werten oder Höhenfeld
# sohle_hoehe_feld =
# sohle_puffer = 2.5                                   # halbe Sohlbreite [m]
# gewaesser    = Wasserflaeche.shp                     # optional: Böschung bis zum Ufer

[verfahren]
max_kante      = 50       # längere Dreiecke verwerfen, dort DGM1
linien_abstand = 1        # Punktabstand entlang der Geländelinien [m]
fang_toleranz  = 0.1      # Punkt liegt auf der Linie bis [m]
auffuell_puffer = 20      # ohne Untersuchungsgebiet: Puffer um Punkte/Linien [m]
eindringtiefe  = 8
bezugsjahr     = 1945

# --- Alternative: Tabelle + Achse statt Punkt-Shape ---
# excel        = EG_LOS4_Eingabe_Tabelle_QP.xlsx
# linien       = Emscherachse.shp                      # Achse, Start-km in der DBF
# km_start     = 15.603
# fliessrichtung_km_steigend = nein                    # links/rechts in Richtung fallender km

[ausgabe]
ausgabe_ordner = Ergebnis
