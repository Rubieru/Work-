# Konfiguration für dgm1945_kern.py (ohne QGIS-Oberfläche)
# Relative Pfade beziehen sich auf den Ordner dieser Datei.
# Aufruf:  python dgm1945_kern.py beispiel_konfiguration.ini

[eingabe]
excel          = Hoehen_1945.xlsx      # Excel (.xlsx/.xls) oder CSV
excel_blatt    =                       # leer = erstes Blatt
linien         = Linien.shp            # Achse + Sohle/Berme/Deich, oder: daten.gpkg|layername=linien
linien_typ_feld = typ                  # Attributfeld mit dem Linientyp
achse_wert     = Achse                 # Wert der Flussachse in diesem Feld
# achse_datei  = Achse.shp             # alternativ: Achse als eigener Layer
# linien_seite_feld = seite            # optional: Feld mit links/rechts an den Linien

# Spaltennamen nur angeben, wenn die automatische Erkennung nicht klappt:
# spalte_km    = Fluss-km
# spalte_name  = Bezeichnung
# spalte_hoehe = Höhe [m NHN]
# spalte_seite = Seite

dgm1           = DGM1                  # Ordner mit Kacheln oder Dateien getrennt durch ;

[kilometrierung]
km_start       = 12.000                # km am ersten Stützpunkt der Achse
km_steigend    = ja                    # km nimmt in Digitalisierrichtung zu
# km_punkte    = km_steine.shp         # alternativ: km-Punkte zur Kalibrierung (statt km_start)
# km_punkte_feld = km
fliessrichtung_km_steigend = ja        # nur relevant für links/rechts
km_einheit_m   = 1000                  # Tabellen-Station in km (1000) bzw. in m (1)

[verfahren]
methode        = lot                   # lot = Querprofil senkrecht zur Achse | entlang
suchweite      = 1000                  # max. Abstand Achse -> Linie [m]
tangenten_fenster = 20                 # Glättung der Achsrichtung [m]
verdichtung    = 5                     # Zusatzpunkte entlang der Linien alle x m (0 = aus)
auto_maske     = ja                    # TIN auf Korridor zwischen äußersten Linien begrenzen
# maske        = Untersuchungsgebiet.shp   # alternativ eigenes Begrenzungspolygon
pixelgroesse   = 1                     # nur wenn kein DGM1 angegeben
# epsg         = 25832                 # nur falls Linien kein KBS haben
eindringtiefe  = 8

[ausgabe]
ausgabe_ordner = Ergebnis
