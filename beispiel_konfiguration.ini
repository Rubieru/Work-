# Konfiguration für dgm1945_kern.py (ohne QGIS-Oberfläche)
# Relative Pfade beziehen sich auf den Ordner dieser Datei.
# Aufruf:  python dgm1945_kern.py beispiel_konfiguration.ini

[eingabe]
excel          = Pkt_mit_tabellen_eintrag.csv   # Excel (.xlsx/.xls) oder CSV
excel_blatt    =                       # leer = erstes Blatt
linien         = Achse.shp             # Flussachse (Shape mit .dbf/.prj), oder: daten.gpkg|layername=achse
dgm1           = DGM1                  # Ordner mit Kacheln oder Dateien getrennt durch ;

# Spaltennamen nur angeben, wenn die automatische Erkennung nicht klappt
# (erkannt werden u.a. KILOMETRIE, SEITE, ABSTAND, HOEHE, JAHR):
# spalte_km      = KILOMETRIE
# spalte_seite   = SEITE
# spalte_abstand = ABSTAND
# spalte_hoehe   = HOEHE
# spalte_jahr    = JAHR

[hoehen]
# bergsenkung_spalte = BERGSENK        # Spalte mit Bergsenkung, wird von der Höhe abgezogen
bergsenkung_faktor = 0.01              # Bergsenkung in cm -> m
bezugsjahr     = 1945                  # mehrere Werte am selben Ort: Jahr am nächsten daran gewinnt
duplikate      = jahr                  # jahr | mittel | alle

[kilometrierung]
# Start-km/-m wird automatisch in der DBF der Achse gesucht (Felder KM, START_M, KM_START …).
# achse_km_feld = START_M              # Feld fest vorgeben
# km_start     = 23.670                # oder von Hand: km am ersten Stützpunkt der Achse
km_steigend    = auto                  # auto | ja | nein  (km in Digitalisierrichtung)
fliessrichtung_km_steigend = ja        # links/rechts gelten in Richtung steigender km
km_einheit_m   = 0                     # Tabellen-Station: 0 = automatisch, 1000 = km, 1 = m

[verfahren]
methode        = auto                  # auto | abstand | lot | entlang
verdichtung    = 5                     # Zwischenprofile alle x m entlang der Achse (0 = aus)
tangenten_fenster = 20                 # Glättung der Achsrichtung [m]
auto_maske     = ja                    # TIN auf den Bereich der Profile begrenzen
dgm1_auffuellen = ja                   # Flächen ohne Tabellenwerte mit DGM1 füllen
auffuell_puffer = 20                   # Füllbereich = Achse ± (max. Abstand + x m)
# maske        = Untersuchungsgebiet.shp   # alternativ eigenes Polygon (TIN-Grenze und Füllbereich)
pixelgroesse   = 1                     # nur wenn kein DGM1 angegeben
# epsg         = 25832                 # nur falls weder Achse noch DGM1 ein KBS haben
eindringtiefe  = 8

[ausgabe]
ausgabe_ordner = Ergebnis
